# Run the configured Truss agent (scheduled job service).
# The image is credential-free (.env and config/ are in .dockerignore).
# Prerequisites: on the RUN host, have config/ and .env (from npm run config
# or a secrets store), then: docker compose up -d
#
# config/ and .env are mounted from the run host at runtime only.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: truss-agent:latest
    container_name: truss-agent
    env_file: .env
    volumes:
      - ./config:/app/config
    restart: unless-stopped
